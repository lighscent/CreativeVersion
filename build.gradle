plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.terraformersmc.com/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
	main {
		java { srcDir 'common/src/main/java' }
		resources { srcDir 'common/src/main/resources' }
	}
}

loom {
	runs {
		clientGameTest {
			client()
			configName = "Client Game Test"
			property "fabric.client.gametest"
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')

tasks.register('buildMc121', Exec) {
	group = 'build'
	description = 'Builds the 1.21.10 / 1.21.11 jars with the mc121 Gradle build.'
	workingDir = layout.projectDirectory
	commandLine = [file(isWindows ? 'gradlew.bat' : 'gradlew').absolutePath, '-p', 'mc121', 'build']
}

tasks.register('collectJars', Copy) {
	group = 'build'
	description = 'Copies all built jars into the output/ directory.'
	dependsOn(tasks.named('jar'), tasks.named('buildMc121'))
	mustRunAfter(tasks.named('check'))
	from('build/libs') {
		include '*.jar'
		exclude '*-sources.jar'
	}
	from('mc121/v1_21_10/build/libs') {
		include '*.jar'
		exclude '*-sources.jar'
	}
	from('mc121/v1_21_11/build/libs') {
		include '*.jar'
		exclude '*-sources.jar'
	}
	into('output')
}

tasks.named('build') {
	dependsOn('collectJars')
}

tasks.named('clean') {
	delete 'output'
	delete 'mc121/v1_21_10/build'
	delete 'mc121/v1_21_11/build'
}

processResources {
	def props = [version: project.mod_version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
